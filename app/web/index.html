<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>RAG 知识库问答</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; max-width: 860px; margin: 24px auto; padding: 0 12px; }
  textarea { width: 100%; height: 110px; font-family: inherit; }
  input, button { padding: 6px 10px; font-size: 14px; }
  .row { display: flex; gap: 8px; margin: 8px 0; }
  .card { border: 1px solid #d9dee5; border-radius: 8px; padding: 12px; margin: 10px 0; }
  .cite { color: #6b7280; font-size: 13px; }
  pre { white-space: pre-wrap; background: #f6f8fa; padding: 10px; border-radius: 6px; }
</style>
</head>
<body>
<h2>RAG 知识库问答（练习版）</h2>
<div class="card">
  <h3>1. 上传文档</h3>
  <div class="row"><input id="docId" placeholder="文档 ID，如 doc-1" size="18"><input id="title" placeholder="标题" size="28"></div>
  <textarea id="text" placeholder="粘贴纯文本内容（.txt/.md）"></textarea>
  <div class="row"><button onclick="upload()">入库</button><span id="ingestMsg" class="cite"></span></div>
</div>
<div class="card">
  <h3>2. 提问</h3>
  <div class="row"><input id="q" placeholder="输入问题" size="52"><button onclick="ask()">提问</button></div>
  <pre id="answer"></pre>
  <div id="cites" class="cite"></div>
</div>
<script>
async function upload() {
  const body = { doc_id: docId.value, title: title.value, text: text.value, tags: [] };
  const r = await fetch('/documents', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  ingestMsg.textContent = r.ok ? '已入库：' + JSON.stringify(await r.json()) : '失败：' + r.status;
}
async function ask() {
  const r = await fetch('/query', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ question: q.value }) });
  const data = await r.json();
  answer.textContent = '[' + data.mode + ']\n' + data.answer;
  cites.innerHTML = (data.citations || []).map(c => '[' + c.index + '] 《' + c.title + '》 片段' + c.chunk_index + ' 相关度 ' + c.score).join('<br>');
}
</script>
</body>
</html>
