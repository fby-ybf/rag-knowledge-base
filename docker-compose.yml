services:
  rag:
    build: .
    container_name: rag-knowledge-base
    ports:
      - "8000:8000"
    environment:
      # 不配置 OPENAI_API_KEY 时自动进入离线模式
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - rag-data:/srv/data
    restart: unless-stopped

volumes:
  rag-data:
